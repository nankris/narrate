default_provider: nebius
providers:
  nebius:
    base_url: https://api.tokenfactory.nebius.com/v1/
    key_env: NEBIUS_API_KEY
    final: true
    models:
      perceive: nvidia/Nemotron-3.5-Super-VL
      fit: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
      fit_alt: nvidia/Nemotron-3_5-Lightning
      edit: nvidia/Nemotron-3-Ultra-550b-a55b
      orchestrate: nvidia/Nemotron-3-Ultra-550b-a55b
      orchestrate_alt: nvidia/nemotron-3-super-120b-a12b
    thinking: false
  nvidia-dev:
    base_url: https://integrate.api.nvidia.com/v1
    key_env: NVIDIA_DEV_API_KEY
    final: false
    rpm: 40
    models:
      perceive: nvidia/nemotron-3.5-super-vl-120b-a12b
      fit: nvidia/nemotron-3.5-lightning-30b-a3b
      fit_alt: nvidia/nemotron-3.5-lightning-30b-a3b
      edit: nvidia/nemotron-3-ultra-550b-a55b
      orchestrate: nvidia/nemotron-3-ultra-550b-a55b
    thinking: false
prices:
  perceive:
    input_price: 0.3
    output_price: 0.9
    cached_input_price: 0.06
  fit:
    input_price: 0.06
    output_price: 0.24
    cached_input_price: 0.012
  # Token Factory catalog: nvidia/Nemotron-3_5-Lightning 0.06/0.24 (cached 0.03) per 1M tokens.
  # The catalog also lists a second tier 0.15/0.6/0.1, likely the "fast" flavor; not used here.
  fit_alt:
    input_price: 0.06
    output_price: 0.24
    cached_input_price: 0.03
  edit:
    input_price: 1.0
    output_price: 3.0
    cached_input_price: 0.12
  orchestrate:
    input_price: 1.0
    output_price: 3.0
    cached_input_price: 0.12
  orchestrate_alt:
    input_price: 0.3
    output_price: 0.9
    cached_input_price: 0.06
stages:
  perceive:
    max_tokens: 3000
    reasoning: 'off'
    thinking: false
  fit:
    max_tokens: 2000
    reasoning: 'off'
    thinking: false
  fit_alt:
    max_tokens: 2000
    reasoning: 'off'
    thinking: false
  edit:
    max_tokens: 4000
    reasoning: 'off'
    thinking: false
  orchestrate:
    max_tokens: 1800
    thinking: false
  orchestrate_alt:
    max_tokens: 1800
    thinking: false
extra_body_thinking: true
image_tokens: 1800
video_tokens_per_second: 600
perception_strategy: auto
frame_interval: 3
silence_db: -35
silence_min: 1.0
words_per_second:
  en: 2.3
  hi: 2.6
word_margin: 1
max_duration: 120
tts:
  backend: auto
  voices:
    en: en
    hi: hi
  piper_models:
    en: voices/en_US-ljspeech-medium.onnx
    hi: voices/hi_IN-priyamvada-medium.onnx
ducking_level: 0.18
budget_usd: 0.25
agent:
  max_steps: 30
  budget_usd: 0.5
  max_inspections: 12
  max_verifications: 8
  timeout_s: 600
  max_atempo: 1.25
  min_gap: 1.2
  min_gap_s: 1.5
  max_slot_s: 12
  max_cue_s: 8.0
  history_turns: 6
  verify_below: 0.75
  retry_attempts: 3
  hangover_s: 0.3
  scene_context: true   # one Super VL pass over 6 frames: setting, people, ingredients, tools
  scene_frames: 6
director:              # v2 default mode (DESIGN_v2.md): timeline -> bible -> one-shot script -> verify/repair -> Hindi
  window_s: 12          # Super VL video windows covering the WHOLE clip (snapped to shot cuts); ~10 per 2-min clip
  window_snap_s: 2
  window_fps: 4
  window_fallback_frames: 4
  ultra_stage: edit     # Nemotron 3 Ultra: bible, script, repair, Hindi
  bible_stage: edit     # or orchestrate_alt (Super, nebius only) to trade quality for cost
  tighten_stage: fit    # Nemotron Nano: shortens cues that are only over budget, before any Ultra repair
  max_ultra_calls: 6
  budget_usd: 0.15      # SpendGuard hard cap per run (target <= 0.10 per 2-min clip)
  min_words: 4          # gaps whose measured budget is smaller stay silent (story context only)
  target_fill: 0.7      # writer aims for a 70-90 % range and reports its own word count
  target_fill_max: 0.9
  narrator_wps_en: 2.6  # conservative natural narrator budget; measured seconds remain authoritative
  word_tolerance: 0.15  # accept <=15% word overage only when measured TTS fits with max_atempo
  tighten_attempts: 2   # one cue per Nano call; reject a result that is not shorter
  tighten_max_tokens: 160
  coverage_target: 0.75
  similarity_prev: 0.5
  similarity_any: 0.8
  verify_batch: 4       # cues per Super VL verification call
  verify_frames: 2      # stills per cue, taken inside the cue's own gap
  max_repair_rounds: 2
  accept_uncertain: true        # 'uncertain' is accepted only for cues without quotes/numbers/names
  require_verification: true    # no verdict -> cue dropped, never committed unverified
  calibrate_tts: true           # word budgets from the measured speaking rate of the actual TTS voice
  relook_max: 2                 # focused Super VL re-looks where the bible expects a beat no event shows (e.g. tasting)
  min_detail_words: 2           # a cue needs >= 2 content words beyond who acts ("The cook rolls." fails)
  openings_max_share: 0.5       # one two-word opening may start at most half the cues; extra ones get a restyle repair
  openings_min_cues: 3
  hi_passive_share: 0.5         # Hindi: at most one passive per line, passive lines at most half the track (soft refit)
ui:
  mode: director       # live runs: director (v2) or agent
  session_cap_usd: 0.25
  daily_cap_usd: 3.0
  per_run_cap_usd: 0.25
  max_turns: 24        # hard orchestrator-turn cap for live UI runs
  timeout_s: 300       # hard wall-clock cap for live UI runs
